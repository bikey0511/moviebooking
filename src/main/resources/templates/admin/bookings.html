<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: layout('Quản lý đặt vé', 'bookings', ~{::main-content}, ~{::page-scripts})}">
<head><title>Bookings</title></head>
<body>
<th:block th:fragment="main-content">
    <div class="container-fluid">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="fs-3 mb-1">Quản lý đặt vé</h1>
                <p class="mb-0 text-secondary">Danh sách vé đã đặt và trạng thái thanh toán</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="admin-filter-tabs">
                    <a th:href="@{/admin/bookings}" th:classappend="${currentStatus == null} ? 'active'">Tất cả</a>
                    <a th:href="@{/admin/bookings(status='PENDING')}" th:classappend="${currentStatus == 'PENDING'} ? 'active'">Chờ thanh toán</a>
                    <a th:href="@{/admin/bookings(status='PAID')}" th:classappend="${currentStatus == 'PAID'} ? 'active'">Đã thanh toán</a>
                    <a th:href="@{/admin/bookings(status='CONFIRMED')}" th:classappend="${currentStatus == 'CONFIRMED'} ? 'active'">Đã xác nhận</a>
                    <a th:href="@{/admin/bookings(status='CANCELLED')}" th:classappend="${currentStatus == 'CANCELLED'} ? 'active'">Đã hủy</a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Người dùng</th>
                            <th>Phim</th>
                            <th>Phòng</th>
                            <th>Suất chiếu</th>
                            <th>Tổng thanh toán</th>
                            <th>Trạng thái</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="booking : ${bookings.content}">
                            <td th:text="${booking.id}">1</td>
                            <td th:text="${booking.user.username}">user</td>
                            <td th:text="${booking.showtime.movie.title}">Phim</td>
                            <td th:text="${booking.showtime.room.name}">Phòng 1</td>
                            <td th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')}">01/01/2024</td>
                            <td>
                                <span th:text="${#numbers.formatDecimal(totalPaymentMap != null and totalPaymentMap[booking.id] != null ? totalPaymentMap[booking.id] : booking.totalPrice, 1, 'COMMA', 0, 'POINT')}">0</span> VNĐ
                                <span th:if="${booking.discountAmount != null and booking.discountAmount.compareTo(0) > 0}" class="text-success small d-block" title="Giảm giá">
                                    −<span th:text="${#numbers.formatDecimal(booking.discountAmount, 1, 'COMMA', 0, 'POINT')}">0</span>
                                </span>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${booking.status.name() == 'PAID'} ? ' text-bg-info' : (${booking.status.name() == 'PENDING'} ? ' text-bg-warning' : (${booking.status.name() == 'CONFIRMED'} ? ' text-bg-success' : ' text-bg-secondary'))"
                                      th:text="${booking.status.name() == 'PAID'} ? 'Đã thanh toán' : (${booking.status.name() == 'PENDING'} ? 'Chờ thanh toán' : (${booking.status.name() == 'CONFIRMED'} ? 'Đã xác nhận' : 'Đã hủy'))">Trạng thái</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/bookings/{id}(id=${booking.id})}" class="btn btn-sm btn-primary">
                                    <i class="ti ti-eye"></i>
                                </a>
                                <form th:if="${booking.status.name() == 'PAID'}" th:action="@{'/admin/bookings/' + ${booking.id} + '/confirm'}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-success" title="Xác nhận thanh toán">
                                        <i class="ti ti-check"></i>
                                    </button>
                                </form>
                                <form th:if="${booking.status.name() != 'CANCELLED' and booking.status.name() != 'CONFIRMED'}" th:action="@{'/admin/bookings/' + ${booking.id} + '/cancel'}" method="post" class="d-inline"
                                      onsubmit="return confirm('Bạn có chắc chắn muốn hủy đặt vé này?');">
                                    <button type="submit" class="btn btn-sm btn-danger">
                                        <i class="ti ti-x"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookings.content)}">
                            <td colspan="8" class="text-center text-secondary py-4">Không tìm thấy đặt vé nào</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <nav th:if="${bookings.totalPages > 1}" class="mt-3">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${bookings.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/bookings(page=${bookings.number}, status=${currentStatus})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, bookings.totalPages - 1)}"
                            th:classappend="${i == bookings.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/bookings(page=${i}, status=${currentStatus})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${bookings.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/bookings(page=${bookings.number + 1}, status=${currentStatus})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="page-scripts"></th:block>
</body>
</html>
