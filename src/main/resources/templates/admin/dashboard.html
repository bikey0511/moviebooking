<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: layout('Trang quản trị', 'dashboard', ~{::main-content}, ~{::page-scripts})}">
<head><title>Dashboard</title></head>
<body>
<th:block th:fragment="main-content">
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="fs-3 mb-1">Trang quản trị</h1>
                <p class="mb-0 text-secondary">Tổng quan rạp chiếu phim</p>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon mb-2"><i class="ti ti-movie"></i></div>
                    <div class="admin-stat-value" th:text="${totalMovies}">0</div>
                    <div class="admin-stat-label">Tổng số phim</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon mb-2"><i class="ti ti-ticket"></i></div>
                    <div class="admin-stat-value" th:text="${totalBookings}">0</div>
                    <div class="admin-stat-label">Tổng số đặt vé</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon mb-2"><i class="ti ti-users"></i></div>
                    <div class="admin-stat-value" th:text="${totalUsers}">0</div>
                    <div class="admin-stat-label">Tổng số người dùng</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="admin-stat-card">
                    <div class="admin-stat-icon mb-2"><i class="ti ti-currency-dollar"></i></div>
                    <div class="admin-stat-value">
                        <span th:text="${#numbers.formatDecimal(totalRevenue, 1, 'COMMA', 0, 'POINT')}">0</span>
                        <span class="fs-6 fw-normal text-secondary">VNĐ</span>
                    </div>
                    <div class="admin-stat-label">Tổng doanh thu</div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-lg-8">
                <div class="admin-chart-card">
                    <h2 class="h5 mb-3"><i class="ti ti-chart-line me-2"></i>Doanh thu theo tháng</h2>
                    <canvas id="revenueChart" height="280"></canvas>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="admin-chart-card">
                    <h2 class="h5 mb-3"><i class="ti ti-chart-donut me-2"></i>Trạng thái đặt vé</h2>
                    <canvas id="bookingStatusChart" height="260"></canvas>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3"><i class="ti ti-list me-2"></i>Đặt vé gần đây</h2>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Người dùng</th>
                                    <th>Phim</th>
                                    <th>Suất chiếu</th>
                                    <th>Tổng thanh toán</th>
                                    <th>Trạng thái</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="booking : ${recentBookings}">
                                    <td th:text="${booking.id}">1</td>
                                    <td th:text="${booking.user.username}">user</td>
                                    <td th:text="${booking.showtime.movie.title}">Movie</td>
                                    <td th:text="${#temporals.format(booking.showtime.startTime, 'dd/MM/yyyy HH:mm')}">2024-01-01</td>
                                    <td><span th:text="${#numbers.formatDecimal(totalPaymentMap != null and totalPaymentMap[booking.id] != null ? totalPaymentMap[booking.id] : booking.totalPrice, 1, 'COMMA', 0, 'POINT')}">0</span> VNĐ</td>
                                    <td>
                                        <span class="badge rounded-pill"
                                              th:classappend="${booking.status == 'PAID'} ? ' text-bg-success' : (${booking.status == 'PENDING'} ? ' text-bg-warning' : ' text-bg-danger')"
                                              th:text="${booking.status == 'PAID'} ? 'Đã thanh toán' : (${booking.status == 'PENDING'} ? 'Chờ xác nhận' : 'Đã hủy')">PAID</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/bookings/{id}(id=${booking.id})}" class="btn btn-sm btn-primary">
                                            <i class="ti ti-eye"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentBookings)}">
                                    <td colspan="7" class="text-center text-secondary py-4">Chưa có đặt vé nào</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
<th:block th:fragment="page-scripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const chartText = '#495057';
        const chartGrid = '#e9ecef';
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');
        const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
        const revenueValues = [];
        const monthlyData = /*[[${monthlyRevenue}]]*/ null;
        for (let i = 1; i <= 12; i++) {
            revenueValues.push(monthlyData && monthlyData[i] ? monthlyData[i] : 0);
        }
        new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Doanh thu (VNĐ)',
                    data: revenueValues,
                    borderColor: '#E66239',
                    backgroundColor: 'rgba(230, 98, 57, 0.12)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { labels: { color: chartText } }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { color: chartText },
                        grid: { color: chartGrid }
                    },
                    x: {
                        ticks: { color: chartText },
                        grid: { color: chartGrid }
                    }
                }
            }
        });
        const statusCtx = document.getElementById('bookingStatusChart').getContext('2d');
        const paidBookings = /*[[${paidBookings}]]*/ 0;
        const pendingBookings = /*[[${pendingBookings}]]*/ 0;
        const cancelledBookings = /*[[${cancelledBookings}]]*/ 0;
        new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: ['Đã thanh toán', 'Chờ xác nhận', 'Đã hủy'],
                datasets: [{
                    data: [paidBookings, pendingBookings, cancelledBookings],
                    backgroundColor: ['#00C951', '#F0B100', '#FB2C36']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: chartText }
                    }
                }
            }
        });
    </script>
</th:block>
</body>
</html>
